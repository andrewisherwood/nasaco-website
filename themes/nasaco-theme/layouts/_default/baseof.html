<!DOCTYPE html>
<html class="scroll-smooth scroll-pt-[88px]" lang="{{ site.LanguageCode | default `en-US` }}">
    {{- partial "head.html" . -}}
    <body class="body-js">
        <a class="skip-link" href="#content">Skip to main content</a>
        {{- partial "header.html" . -}}
        <main id="content">
        {{- block "main" . }}{{- end }}
        </main>

        {{- partial "footer.html" . -}}

        <script src="/js/script.js?v={{ now.Unix }}" defer></script>
    </body>
</html>
