<section class="h-[300px] w-full p-0">
    {{$image_description:= .image_description}}
    {{with .image}}
        {{- $img:= resources.Get  (printf "%s" .) -}}
        {{- $img_desktop:= $img.Resize "webp 1920x" -}}
        {{- $img_mobile:= $img.Resize "webp 720x" -}}
            <picture>
                <source media="(max-width: 979px)" srcset="{{$img_mobile.Permalink}}">
                <source media="(min-width: 980px)" srcset="{{$img_desktop.Permalink}}">
                <img class="h-full w-full object-cover" width="{{$img_desktop.Width}}" height="{{$img_desktop.Height}}" src="{{$img_mobile.Permalink}}" alt="{{$image_description}}">
            </picture>
    {{end}}
</section>
