<section id="contact" class="pt-[83px] pb-[106px] lg:pb-[154px]">
    <div class="container">
        <h2 class="section-heading text-center mb-[80px]">{{ .heading | markdownify }}</h2>
        <div class="lg:flex lg:justify-between lg:gap-[30px] max-w-[1195px] w-full mx-auto">
            <form class="max-w-[548px] w-full mx-auto lg:mx-0" name="contact" method="POST" data-netlify="true">
                <input type="hidden" name="form-name" value="contact">
                <label class="visually-hidden" for="name">Your name</label>
                <input class="input mb-12" name="name" id="name" type="text" placeholder="Your name*">
                <label class="visually-hidden" for="email">Your e-mail</label>
                <input class="input mb-12" name="email" id="email" type="text" placeholder="Your e-mail*">
                <label class="visually-hidden" for="phone">Phone number</label>
                <input class="input mb-12" name="phone" id="phone" type="text" placeholder="Phone number*">
                <label class="visually-hidden" for="subject">Subject</label>
                <input class="input mb-12" name="subject" id="subject" type="text" placeholder="Subject">
                <label class="visually-hidden" for="message">Your message</label>
                <input class="input mb-12" name="message" id="message" type="text" placeholder="Your message">
                <button class="download-btn primary-btn !px-[45px]" type="submit">Submit</button>
            </form>
            <div class="max-w-[548px] lg:max-w-[357px] w-full mx-auto lg:mx-0">
                <p class="text-base font-bold leading-[1.6] text-[#383C3E] tracking-[0.5px] mb-8">{{site.Params.form_contact_heading}}</p>
                <p class="text-base leading-[1.6] tracking-[0.5px] text-[#383C3E] mb-12">{{site.Params.address}}</p>
                <p class="text-base leading-[1.6] tracking-[0.5px] font-inter mb-8">
                    <a class="flex items-center gap-[10px] text-[#383C3E]" href="tel:{{site.Params.phone_url}}">
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M13.7071 11.7071L16.3552 14.3552C16.7113 14.7113 16.7113 15.2887 16.3552 15.6448C14.43 17.57 11.3821 17.7866 9.20399 16.153L7.62857 14.9714C5.88504 13.6638 4.33622 12.115 3.02857 10.3714L1.84701 8.79601C0.213407 6.61788 0.430014 3.56999 2.35523 1.64477C2.71133 1.28867 3.28867 1.28867 3.64477 1.64477L6.29289 4.29289C6.68342 4.68342 6.68342 5.31658 6.29289 5.70711L5.27175 6.72825C5.10946 6.89054 5.06923 7.13846 5.17187 7.34373C6.35853 9.71706 8.28294 11.6415 10.6563 12.8281C10.8615 12.9308 11.1095 12.8905 11.2717 12.7283L12.2929 11.7071C12.6834 11.3166 13.3166 11.3166 13.7071 11.7071Z" stroke="#111111"/>
                        </svg>
                        {{site.Params.phone}}
                    </a>
                </p>
                <p class="text-base leading-[1.6] tracking-[0.5px] font-inter">
                    <a class="flex items-center gap-[10px] text-[#383C3E]" href="mailto:{{site.Params.email}}">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M4 4H20C21.1 4 22 4.9 22 6V18C22 19.1 21.1 20 20 20H4C2.9 20 2 19.1 2 18V6C2 4.9 2.9 4 4 4Z" stroke="black" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M22 6L12 13L2 6" stroke="black" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        {{site.Params.email}}
                    </a>
                </p>
            </div> 
        </div>
    </div>
</section>
