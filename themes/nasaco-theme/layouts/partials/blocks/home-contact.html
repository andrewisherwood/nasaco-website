<section id="contact" class="section bg-mist">
    <div class="container">
        <div class="grid gap-12 lg:grid-cols-[5fr_7fr] lg:gap-20">
            <div>
                <h2 class="section-heading">{{ .heading | markdownify }}</h2>
                {{- with .text }}
                <p class="lead mt-4 max-w-[40ch]">{{ . | markdownify }}</p>
                {{- end }}

                <div class="mt-10 space-y-7">
                    <div>
                        <h3 class="font-sans text-base font-semibold text-ink">{{ site.Params.form_contact_heading }}</h3>
                        <address class="not-italic body-text mt-1">{{ site.Params.address }}</address>
                    </div>
                    <div>
                        <h3 class="font-sans text-base font-semibold text-ink">Telephone</h3>
                        <a class="text-link mt-1 inline-block text-xl" href="tel:{{ site.Params.phone_url }}">{{ site.Params.phone }}</a>
                    </div>
                    <div>
                        <h3 class="font-sans text-base font-semibold text-ink">Email</h3>
                        <a class="text-link mt-1 inline-block text-xl" href="mailto:{{ site.Params.email }}">{{ site.Params.email }}</a>
                    </div>
                </div>
            </div>

            <form class="bg-white rounded-[4px] border border-rule p-6 sm:p-8 lg:p-10" name="contact" method="POST" data-netlify="true">
                <input type="hidden" name="form-name" value="contact">
                <h3 class="card-heading mb-8">Send us a message</h3>
                <div class="grid gap-6 sm:grid-cols-2">
                    <div>
                        <label class="field-label" for="name">Your name <span class="field-hint">(required)</span></label>
                        <input class="input" name="name" id="name" type="text" autocomplete="name" required>
                    </div>
                    <div>
                        <label class="field-label" for="email">Email address <span class="field-hint">(required)</span></label>
                        <input class="input" name="email" id="email" type="email" autocomplete="email" required>
                    </div>
                    <div>
                        <label class="field-label" for="phone">Phone number</label>
                        <input class="input" name="phone" id="phone" type="tel" autocomplete="tel">
                    </div>
                    <div>
                        <label class="field-label" for="subject">Subject</label>
                        <input class="input" name="subject" id="subject" type="text">
                    </div>
                    <div class="sm:col-span-2">
                        <label class="field-label" for="message">Your message</label>
                        <textarea class="input min-h-[160px] resize-y" name="message" id="message" rows="6"></textarea>
                    </div>
                </div>
                <button class="primary-btn mt-8" type="submit">Send message</button>
            </form>
        </div>
    </div>
</section>
